name: swahilipothub
description: "Official App for SwahiliPot Hub" 
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.0
 
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  toastification: ^3.2.0
  vibration: ^3.2.0
  dropdown_button2: ^3.1.0
  flutter_animate: ^4.5.2
  hugeicons_pro: ^0.0.3
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 

flutter:
 
  uses-material-design: true

  assets:
    - assets/images/logos/swahilipot-fm-logo.png
    - assets/images/logos/swahilipot-logo.png

